{% extends 'core/base.html' %}
{% block title %}All Agents{% endblock %}
{% block content %}
    <h1 class="mb-4">All Agents</h1>

    {% if agents %}
        <div class="list-group">
            {% for agent in agents %}
                <a href="{% url 'agent_detail' agent.id %}" class="list-group-item list-group-item-action">
                    {{ agent.user.username }}
                </a>
            {% endfor %}
        </div>
    {% else %}
        <p class="text-muted">No agents available.</p>
    {% endif %}

    <a href="{% url 'home' %}" class="btn btn-outline-secondary mt-4">Back to Home</a>
{% endblock %}
