{% extends 'core/base.html' %}
{% block title %}GoNZ Home{% endblock %}
{% block content %}
    <div class="p-5 mb-4 bg-light rounded-3">
        <h1 class="display-5 fw-bold">Welcome to GoNZ Tourism</h1>
        <p class="fs-4">This is the home page.</p>
        <a href="{% url 'tour_list' %}" class="btn btn-primary me-2">View Tours</a>
        <a href="{% url 'agent_list' %}" class="btn btn-outline-primary">View Agents</a>
    </div>

    {% if not user.is_authenticated %}
        <a href="{% url 'login' %}" class="btn btn-secondary me-2">Login</a>
        <a href="{% url 'signup' %}" class="btn btn-outline-secondary">Signup</a>
    {% endif %}
{% endblock %}
